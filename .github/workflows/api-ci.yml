name: API CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      # Prisma generation reads the URL but does not connect to a database.
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/resonance_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --runInBand
      - name: HTTP tests
        run: npm run test:e2e -- --runInBand
      - name: Build
        run: npm run build
